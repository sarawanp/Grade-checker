[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node build.js"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/lib/Code.gs", "netlify/functions/lib/gas-mock.js"]

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/teacher"
  to = "/teacher.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
